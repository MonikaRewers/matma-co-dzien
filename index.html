<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Matma co dzień</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=STIX+Two+Text:wght@400;600&display=swap">
<style>
[hidden]{display:none!important}
/* Układ: zeszyt w kratkę; jedna kolumna kart, zadanie w centrum uwagi, duży zapis matematyczny */
:root {
  --bg: #f4f7fb; --grid: rgba(48, 92, 170, .08); --card: #ffffff; --line: #d5deea;
  --ink: #17223b; --muted: #5a6880; --accent: #1f4fd1; --accent-soft: #e5ecfc; --on-accent: #ffffff;
  --ok: #17784f; --ok-soft: #e3f4ec; --bad: #b8402a; --bad-soft: #fbe9e5; --warn: #94600a; --warn-soft: #fbf1dc;
  --rev: #7a4fb0; --rev-soft: #f0e9f8;
  --sun: #f6c934; --sun-edge: #d9a90f; --sun-ink: #3d2a00;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1522; --grid: rgba(140, 170, 230, .06); --card: #172033; --line: #2a3650;
  --ink: #e7ecf6; --muted: #9eabc4; --accent: #7f9dff; --accent-soft: #1f2c4d; --on-accent: #0c1430;
  --ok: #5fd3a0; --ok-soft: #12352a; --bad: #ff8f78; --bad-soft: #3a1d18; --warn: #f3c260; --warn-soft: #3a2d12;
  --rev: #c4a3f0; --rev-soft: #2c2140; --sun: #f6c934; --sun-edge: #b88d07; --sun-ink: #3d2a00; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1522; --grid: rgba(140, 170, 230, .06); --card: #172033; --line: #2a3650;
  --ink: #e7ecf6; --muted: #9eabc4; --accent: #7f9dff; --accent-soft: #1f2c4d; --on-accent: #0c1430;
  --ok: #5fd3a0; --ok-soft: #12352a; --bad: #ff8f78; --bad-soft: #3a1d18; --warn: #f3c260; --warn-soft: #3a2d12;
  --rev: #c4a3f0; --rev-soft: #2c2140; --sun: #f6c934; --sun-edge: #b88d07; --sun-ink: #3d2a00; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.5;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; min-height: 100%; }
#app { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
  padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 2.1rem; font-weight: 800; line-height: 1.1; }
h2 { font-size: 1.2rem; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
h2 small { font-family: var(--f-body); font-size: .8rem; color: var(--muted); font-weight: 400; }
p { margin: 0; }
.eyebrow { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.lead { color: var(--muted); max-width: 46ch; }
.fine { font-size: .85rem; color: var(--muted); }
.paper { display: flex; gap: 10px; align-items: center; background: var(--warn-soft); border-left: 4px solid var(--sun-edge); border-radius: 10px; padding: 10px 14px; font-weight: 700; }
.paper.sm { font-size: .85rem; padding: 6px 12px; font-weight: 400; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.top.slim { align-items: center; }
.btn { font: inherit; font-weight: 700; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); padding: 10px 16px; cursor: pointer; min-height: 44px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { font-size: 1.1rem; padding: 14px 22px; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn:disabled { opacity: .55; cursor: default; }
.link { font: inherit; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 8px 0; font-weight: 700; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.login { gap: 18px; padding-block: 28px; }
.loginrow { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; align-items: end; }
.loginrow label { grid-column: 1 / -1; font-weight: 700; }
.loginrow input { font: inherit; font-size: 1.15rem; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; letter-spacing: .04em; }
/* tydzień */
.week { display: flex; flex-direction: column; gap: 8px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { border: 1.5px dashed var(--line); border-radius: 10px; text-align: center; padding: 6px 0 4px; display: flex; flex-direction: column; font-size: .8rem; color: var(--muted); }
.day b { font-size: 1.1rem; height: 1.5rem; color: var(--ok); }
.day.done { border-style: solid; border-color: var(--ok); background: var(--ok-soft); color: var(--ink); }
.day.today { box-shadow: inset 0 0 0 2px var(--accent); }
.weeknote { font-size: .95rem; }
.startrow { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.stk { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.sticker { width: 96px; height: 96px; flex: none; }
.sticker.sm { width: 40px; height: 40px; }
/* umiejętności */
.klh { margin: 18px 4px 6px; font-size: 1.2rem; }
.axis { width: 100%; max-width: 380px; height: auto; display: block; margin: 0 auto; color: var(--ink, currentColor); }
.skills { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.skills li { display: grid; grid-template-columns: 2.4rem 1fr auto; grid-template-areas: "c n m" "c l l"; column-gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; }
.skills li:first-child { border-top: 0; }
.skills .code { grid-area: c; font-family: var(--f-display); font-weight: 600; color: var(--muted); font-size: .9rem; }
.skills .sname { grid-area: n; min-width: 0; }
.skills .meter { grid-area: m; }
.skills .lvl { grid-area: l; font-size: .8rem; color: var(--muted); }
.skills li.locked { opacity: .5; }
.skills li.locked .lvl { grid-area: m; }
.lvl.upc { color: var(--ok); font-weight: 700; } .lvl.downc { color: var(--bad); font-weight: 700; }
.meter { display: inline-flex; gap: 3px; }
.meter i { width: 18px; height: 8px; border-radius: 4px; background: var(--line); }
.meter i.on { background: var(--ok); }
.teacher summary { cursor: pointer; font-weight: 700; color: var(--muted); }
.tgrid { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.tgrid select { font: inherit; padding: 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); max-width: 100%; }
.tbtns { display: flex; gap: 8px; flex-wrap: wrap; }
/* sesja */
.prog { flex: 1; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.prog div { height: 100%; background: var(--accent); border-radius: 5px; }
.count { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--muted); }
.task { gap: 18px; padding-block: 24px; }
.tag { align-self: flex-start; font-size: .8rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
.tag.cur { background: var(--accent-soft); color: var(--accent); }
.tag.rev { background: var(--rev-soft); color: var(--rev); }
.q { font-size: 1.1rem; font-weight: 700; }
.math, .sol, .opt, .ans { font-family: var(--f-math); }
.math { font-size: 2.1rem; padding: 10px 0; overflow-x: auto; white-space: normal; word-spacing: .05em; line-height: 1.3; }
.math sup, .sol sup, .opt sup { font-size: .6em; vertical-align: .9em; line-height: 0; margin-left: .04em; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 .12em; font-size: .82em; line-height: 1.12; }
.fr > span { padding: 0 .18em; text-align: center; }
.fr > span:first-child { border-bottom: .07em solid currentColor; padding-bottom: .06em; }
.fr > span:last-child { padding-top: .06em; }
.rt { display: inline-flex; align-items: stretch; vertical-align: middle; white-space: nowrap; }
.rsv { width: .5em; height: auto; align-self: stretch; flex: none; overflow: visible; margin-top: .1em; }
.rc { border-top: 1.6px solid currentColor; padding: .1em .14em 0; display: inline-flex; align-items: center; margin-top: .1em; }
.ri { font-size: .45em; align-self: flex-start; margin-right: -.45em; margin-top: .55em; position: relative; z-index: 1; }
.pa { font-size: 1.3em; line-height: 1; vertical-align: middle; font-weight: 300; }
.aform { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.ans { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 1.6rem; max-width: 100%; }
.box { font-family: var(--f-math); font-size: 1.5rem; width: 4.2ch; min-width: 0; padding: 6px 6px; border-radius: 8px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); text-align: center; }
.box::placeholder { font-family: var(--f-body); font-size: .6rem; color: var(--muted); }
.box.wide { width: 7ch; } .box.whole { width: 3.6ch; } .box.coef { width: 3.6ch; } .box.exp { width: 4.2ch; font-size: 1.1rem; }
.box:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.frin { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
.frin i { width: 100%; height: 2.5px; background: var(--ink); border-radius: 2px; }
.frin .box { width: 5ch; }
.rtin { display: inline-flex; align-items: stretch; }
.sfn { display: inline-flex; align-items: flex-end; gap: 4px; } .frin .sfn .box { width: 4ch; }
.rtin .rsv { width: 18px; margin-top: 4px; }
.rtin .rc { border-top: 2.5px solid var(--ink); padding: 6px 4px 0; margin-top: 4px; }
.rtin .rc .box { width: 6ch; }
.rtin .ri { font-size: .8rem; margin-top: 10px; margin-right: -8px; }
.supin { display: inline-flex; gap: 4px; align-self: flex-start; align-items: center; margin-top: -10px; }
.op { white-space: nowrap; }
.sign { font: 700 1.2rem var(--f-body); min-width: 44px; height: 44px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; }
.sign small { font-size: .7rem; }
.sign.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.supin .sign { min-width: 36px; height: 36px; font-size: 1rem; }
.pair { font-size: 1.2rem; font-family: var(--f-body); }
.choice .opt { font-size: 1.7rem; min-width: 5.5rem; padding: 12px 20px; }
.opt.picked { border-color: var(--accent); }
.unit { font-family: var(--f-body); font-size: 1.1rem; color: var(--muted); }
.choice .opt.txt { font-family: var(--f-body); font-size: 1.05rem; min-width: 0; padding: 12px 16px; }
.term { display: inline-flex; align-items: center; gap: 4px; }
.var { white-space: nowrap; }
.fig { display: block; max-width: 100%; height: auto; color: var(--ink); font-family: var(--f-body); font-size: 15px; white-space: normal; }
.fig:not(.grid) { width: 240px; } .fig.grid { width: 330px; }
.fig text { fill: currentColor; }
.fig .gl { stroke: var(--line); stroke-width: 1; } .fig .ax { stroke: currentColor; stroke-width: 1.6; }
.fig .tk { font-size: 9px; fill: var(--muted); } .fig .axl { font-size: 13px; font-style: italic; } .fig .pl { font-size: 15px; font-weight: 700; fill: var(--accent); }
.fb { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.fb:empty { display: none; }
.msg { border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; width: 100%; }
.msg.ok { background: var(--ok-soft); color: var(--ink); border-left: 4px solid var(--ok); }
.msg.ok b { color: var(--ok); }
.msg.bad { background: var(--bad-soft); border-left: 4px solid var(--bad); }
.msg.bad > b { color: var(--bad); }
.msg.warn { background: var(--warn-soft); color: var(--ink); border-left: 4px solid var(--warn); }
.sl { font-size: .85rem; color: var(--muted); font-weight: 700; }
.sol { font-size: 1.3rem; overflow-x: auto; max-width: 100%; line-height: 1.8; }
/* raport */
.report { gap: 16px; }
.score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.pct { font-family: var(--f-display); font-size: 3.4rem; font-weight: 800; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.earned { display: flex; align-items: center; gap: 14px; background: var(--warn-soft); border-radius: 12px; padding: 10px 14px; }

#app.wide { max-width: 1200px; }
.chead { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.tsel { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
.tsel select, .dt { font: inherit; font-size: .95rem; padding: 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); max-width: 100%; }
.tablewrap { overflow-x: auto; }
table.res { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
.res th { text-align: left; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 8px; border-bottom: 1.5px solid var(--line); white-space: nowrap; }
.res td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
.res td.opis { white-space: normal; min-width: 280px; font-size: .85rem; }
.res td.grade { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; color: var(--accent); }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
.free { margin: 0; padding-left: 18px; }
.loginrow label + input + label { margin-top: 6px; }
/* panel rodzica */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.stat span { font-size: .8rem; color: var(--muted); font-weight: 700; }
.stat b { font-family: var(--f-display); font-size: 2rem; font-weight: 800; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat small { font-size: .8rem; color: var(--muted); }
.h3 { font-size: .95rem; margin: 0 0 6px; font-family: var(--f-display); font-weight: 600; }
.wk, .weak { list-style: none; margin: 0; padding: 0; }
.wk li, .weak li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.wk li:first-child, .weak li:first-child { border-top: 0; }
.weak li { flex-wrap: wrap; } .weak small { color: var(--muted); }
.tbtns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.pcard { border: 1.5px dashed var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--card); break-inside: avoid; font-size: .9rem; }
.pcard .url { font-size: .7rem; word-break: break-all; color: var(--muted); }
.pcred { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: baseline; }
.pcred span { font-size: .8rem; color: var(--muted); } .pcred b { font-family: var(--f-display); font-size: 1.3rem; letter-spacing: .04em; }
@media print {
  body { background: #fff !important; color: #000; } #app { max-width: none; padding: 0; } .noprint { display: none !important; }
  .pcards { grid-template-columns: 1fr 1fr; gap: 6mm; } .pcard { border-color: #999; background: #fff; color: #000; min-height: 60mm; }
  .pcred span, .pcard .url, .pcard .eyebrow { color: #444; }
}
@media (max-width: 440px) {
  body { font-size: 16px; } h1 { font-size: 1.8rem; } .math { font-size: 1.8rem; }
  .card { padding: 16px; } .ans { font-size: 1.35rem; } .box { font-size: 1.3rem; }
  .loginrow { grid-template-columns: 1fr; } .btn.big { width: 100%; }
}
@media (prefers-reduced-motion: no-preference) { .prog div { transition: width .3s ease; } .msg { animation: pop .18s ease-out; } @keyframes pop { from { transform: translateY(4px); opacity: .6; } } }
</style>

<main id="app"></main>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwPHG5i4LHXXZ5nA7MGLUZnIzCvsyUUSV0c9wAFlY1O9wvR8aR91749-DIN0reXyF-t/exec';
const MODE = (q => q.get('n') === '1' ? 'n' : q.get('r') === '1' ? 'r' : q.get('p') === '1' ? 'p' : 'u')(new URLSearchParams(location.search));
// ===== Silnik zadań: losowanie, zapis matematyczny, sprawdzanie =====
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; };
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const MINUS = '−';
const neg = n => (n < 0 ? MINUS + Math.abs(n) : String(n));
const F = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const SF = (n, d) => (n < 0 ? MINUS : '') + F(Math.abs(n), d);
const SQ = (x, i) => `<span class="rt">${i ? `<span class="ri">${i}</span>` : ''}<svg class='rsv' viewBox='0 0 12 40' preserveAspectRatio='none' aria-hidden='true'><path d='M0 24 L3 22 L7 39 L12 1' fill='none' stroke='currentColor' stroke-width='1.6' vector-effect='non-scaling-stroke' stroke-linejoin='round'/></svg><span class="rc">${x}</span></span>`;
const S = (a, b, i) => (a === 1 ? '' : a) + SQ(b, i);
const P = (b, e) => `${b}<sup>${typeof e === 'number' ? neg(e) : e}</sup>`;
const par = x => `<span class="pa">(</span>${x}<span class="pa">)</span>`;
const dec = (n, dp) => { const s = String(Math.abs(n)).padStart(dp + 1, '0'); const i = s.slice(0, -dp); const f = s.slice(-dp).replace(/0+$/, ''); return (n < 0 ? MINUS : '') + i + (f ? ',' + f : ''); };
const big = n => (n < 0 ? MINUS : '') + Math.abs(n).toLocaleString('pl-PL');
const isSq = n => Number.isInteger(Math.sqrt(n));
const isCube = n => { const r = Math.round(Math.cbrt(n)); return r * r * r === n; };
const mixed = (n, d) => { const w = Math.floor(n / d), r = n % d; return r === 0 ? String(w) : (w ? w : '') + F(r, d); };
// ----- pomocnicze do wyrażeń, równań, geometrii -----
const X = '<i>x</i>', X2 = '<i>x</i><sup>2</sup>';
const nz = (a, b, ex = []) => { let v; do { v = R(a, b); } while (v === 0 || ex.includes(v)); return v; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const dn = n => { const r = Math.round(n * 1e6) / 1e6; return (r < 0 ? MINUS : '') + String(Math.abs(r)).replace('.', ','); };
const zl = n => { const r = Math.round(n * 100) / 100; return Number.isInteger(r) ? String(r) : r.toFixed(2).replace('.', ','); };
const pp = n => (n < 0 ? par(neg(n)) : String(n));
const kr = n => { const a = Math.abs(n); return a === 1 ? 'kratkę' : a <= 4 ? 'kratki' : 'kratek'; };
// jednomian: c · zmienne; f = [['x', 2], ['y', 1]]
const Mn = (c, f) => ({ c, f });
const vars = f => f.map(([v, e]) => `<i>${v}</i>` + (e > 1 ? `<sup>${e}</sup>` : '')).join('');
const key = t => t.f.map(([v, e]) => v + e).join('');
const mono = (c, f) => { const v = vars(f), a = Math.abs(c); return (c < 0 ? MINUS : '') + (v && a === 1 ? '' : dn(a)) + v; };
function poly(ts) {
  const nz0 = ts.filter(t => t.c !== 0); if (!nz0.length) return '0';

          sol: `Renata: ${X}, Beata: ${k}${X}, Michał: ${k}${X} + ${d}<br>${X} + ${k}${X} + ${k}${X} + ${d} = ${zl(S)}<br>${2 * k + 1}${X} = ${zl(S - d)}, więc ${X} = ${zl(x)} zł. Beata ma ${zl(k * x)} zł, Michał ${zl(k * x + d)} zł.` }; }

  { id: 'E6', g: 'E', name: 'Przekształcanie wzorów', rule: 'Przekształcaj wzór jak równanie: to, co dodane, odejmij od obu stron, a przez to, co mnoży, podziel obie strony.',

        [I('P') + ' = ' + F(par(I('a') + ' + ' + I('b')) + ' · ' + I('h'), '2'), 'a', [F('2' + I('P'), I('h')) + ' − ' + I('b'), F('2' + I('P'), I('h') + ' − ' + I('b')), F(I('P'), I('h')) + ' − ' + I('b'), '2' + I('P') + ' − ' + I('bh')]],

  // ---------- Dział 6: Trójkąty prostokątne ----------
  { id: 'T1', g: 'T', name: 'Twierdzenie Pitagorasa: przeciwprostokątna', rule: 'W trójkącie prostokątnym a² + b² = c², gdzie c to przeciwprostokątna (najdłuższy bok, naprzeciw kąta prostego).',
    gen(B) {
      if (!B) { const [a, b, c] = triple(); return { q: `Przyprostokątne trójkąta prostokątnego mają długości ${a} cm i ${b} cm. Oblicz długość przeciwprostokątnej.`, html: rtri(a, b, '?'), ans: Object.assign(A.num(c), { unit: 'cm' }), sol: `${P('c', 2)} = ${P(a, 2)} + ${P(b, 2)} = ${a * a} + ${b * b} = ${c * c}, więc c = ${SQ(c * c)} = ${c} cm` }; }
      let a, b; do { a = R(1, 9); b = R(a, 10); } while (isSq(a * a + b * b));
      const [k, m] = simp(a * a + b * b);

    } },
  { id: 'T2', g: 'T', name: 'Twierdzenie Pitagorasa: przyprostokątna', rule: 'Gdy znasz przeciwprostokątną c i jedną przyprostokątną a, to b² = c² − a².',

    } },
  { id: 'T3', g: 'T', name: 'Czy trójkąt jest prostokątny?', rule: 'Trójkąt jest prostokątny, gdy kwadrat najdłuższego boku jest równy sumie kwadratów dwóch krótszych boków.',

  { id: 'U1', g: 'U', name: 'Współrzędne punktu', rule: 'Pierwsza współrzędna mówi, ile kratek w prawo (lub w lewo, gdy ujemna), a druga, ile w górę (lub w dół).',

const clean = s => String(s ?? '').trim().replace(/[\s  ]/g, '').replace(',', '.').replace(/[−–]/g, '-');

const bad = v => v == null || Number.isNaN(v);

function check(a, u) {
  const sg = u.sign ? -1 : 1;
  switch (a.t) {
    case 'num': { const x = pnum(u.a1); if (bad(x)) return { r: 'empty' }; const y = sg * x; return close(y, a.v) ? { r: 'ok' } : { r: 'bad', x: y }; }

      if (n == null && d == null && w != null && !Number.isNaN(w)) { const y = sg * w; return close(y, a.n / a.d) ? { r: 'ok' } : { r: 'bad', x: y }; }
      if (bad(n) || bad(d) || Number.isNaN(w)) return { r: 'empty' };
      if (!Number.isInteger(n) || !Number.isInteger(d) || d === 0 || (w != null && !Number.isInteger(w))) return { r: 'empty', msg: 'W liczniku i mianowniku wpisz liczby całkowite.' };
      let s = sg; if (n < 0) { s = -s; n = -n; } if (d < 0) { s = -s; d = -d; } if (w != null && w < 0) { s = -s; w = -w; }
      const W = w || 0, num = s * (W * d + n);
      if (num * a.d !== a.n * d) return { r: 'bad', x: num / d };
      if (n !== 0 && gcd(n, d) !== 1) return { r: 'retry', msg: 'Wynik jest dobry, ale ułamek trzeba jeszcze skrócić.' };
      if (W > 0 && n >= d) return { r: 'retry', msg: 'W liczbie mieszanej ułamek musi być mniejszy od 1.' };
      return { r: 'ok' };
    }
    case 'surd': {
      const c = clean(u.c) === '' ? 1 : pnum(u.c), b = pnum(u.b);
      if (bad(b) || bad(c)) return { r: 'empty' };
      if (c === a.a && b === a.b) return { r: 'ok' };
      if (b > 0 && close(Math.pow(c, a.i) * b, Math.pow(a.a, a.i) * a.b)) return { r: 'retry', msg: 'Wartość się zgadza, ale przed pierwiastek można wyłączyć jeszcze większy czynnik.' };
      return { r: 'bad', c, b };
    }
    case 'sfrac': {
      const c = clean(u.c) === '' ? 1 : pnum(u.c), b = pnum(u.b), d = clean(u.d) === '' ? 1 : pnum(u.d);
      if (bad(b) || bad(c) || bad(d) || d === 0) return { r: 'empty' };
      if (c === a.a && b === a.b && d === a.d) return { r: 'ok' };
      if (b > 0 && close(c * Math.sqrt(b) / d, a.a * Math.sqrt(a.b) / a.d)) return { r: 'retry', msg: 'Wartość się zgadza, ale wynik trzeba jeszcze uprościć: w mianowniku nie może być pierwiastka, przed pierwiastek wyłącz największy czynnik i skróć ułamek.' };

    case 'root': { const b = pnum(u.b); if (bad(b)) return { r: 'empty' }; return b === a.r ? { r: 'ok' } : { r: 'bad', b }; }
    case 'pow': {
      const b = pnum(u.b), e = pnum(u.e); if (bad(b) || bad(e)) return { r: 'empty' };
      if (b === a.b && e === a.e) return { r: 'ok' };
      if (b > 1 && close(e * Math.log(b), a.e * Math.log(a.b))) return { r: 'retry', msg: `Wartość się zgadza, ale zapisz wynik jako potęgę liczby ${a.b}.` };
      return { r: 'bad', b, e };
    }
    case 'sci': {
      const m = pnum(u.m); let e = pnum(u.e); if (bad(m) || bad(e)) return { r: 'empty' }; if (u.esign) e = -e;

      if (close(m * 10 ** e, a.m * 10 ** a.e)) return { r: 'retry', msg: 'Wartość się zgadza, ale pierwsza liczba musi być większa lub równa 1 i mniejsza od 10.' };
      return { r: 'bad', m, e };
    }
    case 'pair': {
      const lo = pnum(u.lo), hi = pnum(u.hi); if (bad(lo) || bad(hi)) return { r: 'empty' };
      return (lo === a.lo && hi === a.hi) || (lo === a.hi && hi === a.lo) ? { r: 'ok' } : { r: 'bad', lo, hi };
    }
    case 'choice': return u.k == null ? { r: 'empty' } : u.k === a.k ? { r: 'ok' } : { r: 'bad', k: u.k };
    case 'expr': {
      const raw = a.terms.map((t, i) => clean(u['c' + i]));
      if (raw.every(x => x === '')) return { r: 'empty' };
      const vals = raw.map((x, i) => (x === '' ? 0 : pnum(u['c' + i]) * (u['s_c' + i] ? -1 : 1)));
      if (vals.some(v => Number.isNaN(v))) return { r: 'empty', msg: 'W okienkach wpisz same liczby.' };
      return a.terms.every((t, i) => close(vals[i], t.c)) ? { r: 'ok' } : { r: 'bad', vals };
    }
    case 'pt': {
      const x = pnum(u.px), y = pnum(u.py); if (bad(x) || bad(y)) return { r: 'empty' };
      const X1 = x * (u.s_px ? -1 : 1), Y1 = y * (u.s_py ? -1 : 1);
      if (close(X1, a.x) && close(Y1, a.y)) return { r: 'ok' };
      if (close(X1, a.y) && close(Y1, a.x) && a.x !== a.y) return { r: 'bad', swapped: true };
      return { r: 'bad' };
    }
  }
  return { r: 'empty' };
}

function solveInputs(a) {

    case 'num': return { a1: f(Math.abs(a.v)), sign: a.v < 0 };
    case 'frac': return { n: String(Math.abs(a.n)), d: String(a.d), sign: a.n < 0 };
    case 'surd': return { c: a.a === 1 ? '' : String(a.a), b: String(a.b) };
    case 'sfrac': return { c: a.a === 1 ? '' : String(a.a), b: String(a.b), d: a.d === 1 ? '' : String(a.d) };
    case 'root': return { b: String(a.r) };
    case 'pow': return { b: String(a.b), e: String(a.e) };
    case 'sci': return { m: f(a.m), e: String(Math.abs(a.e)), esign: a.e < 0 };
    case 'pair': return { lo: String(a.lo), hi: String(a.hi) };
    case 'choice': return { k: a.k };
    case 'expr': { const o = {}; a.terms.forEach((t, i) => { o['c' + i] = f(Math.abs(t.c)); o['s_c' + i] = t.c < 0; }); return o; }

}

function submit(u) {

  // te same funkcje co u ucznia (tydzień, naklejki, poziomy) liczą z danych dziecka
  useClass(PD.klasa);
  prof = { code: PD.code, skills: PD.skills || {}, days: PD.days || [], today: PD.today, log: [], unlocked: PD.unlocked, naklejki: PD.naklejki };
  const c = course(PD.unlocked), wd = weekDays(), nWeek = wd.filter(d => d.done).length, ns = stickers(), S = PD.stats;
  const months = []; { const [y, m] = PD.today.split('-').map(Number); for (let i = 0; i < 10; i++) { const d = new Date(y, m - 1 - i, 1); const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; months.push(k); if (k <= PD.firstMonth) break; } }
  const weekRows = PD.weeks.map(w => {
    const free = PD.free.includes(w), i = PD.started.indexOf(w);
    const val = free ? 'tydzień wolny' : i < 0 ? 'jeszcze nie' : `${S.counts[i]} ${dni(S.counts[i])}${S.counts[i] >= 5 ? ' ★' : ''}`;
    return `<li><span>od ${dmy(w)}</span><b>${val}</b></li>`;
  }).join('');
  app.classList.remove('wide');
  app.innerHTML = `<header class="top"><div><p class="eyebrow">Panel rodzica · uczeń ${esc(PD.code)}</p><h1>Postępy dziecka</h1></div><button class="link" id="plogout">Wyloguj</button></header>
  <section class="card">
    <h2>Ten tydzień</h2>
    <div class="week"><div class="days">${wd.map(d => `<div class="day ${d.done ? 'done' : ''} ${d.isToday ? 'today' : ''}"><span>${d.n}</span><b>${d.done ? '✓' : ''}</b></div>`).join('')}</div>
    <p class="weeknote">${nWeek >= 5 ? `W tym tygodniu dziecko ćwiczyło już <b>${nWeek}</b> dni.` : `Dni pracy w tym tygodniu: <b>${nWeek}</b> z 5. ${nWeek ? '' : 'W tym tygodniu jeszcze nie było sesji. '}`}</p></div>
    <div class="stk">${ns ? sticker(true) : ''}<span>Zdobyte naklejki: <b>${ns}</b> z 6 (6 naklejek to ocena 6)</span></div>
  </section>
  <section class="card">
    <div class="chead"><h2>Podsumowanie miesiąca</h2>
      <div class="tsel"><label for="pmon">Miesiąc</label><select id="pmon">${months.map(m => `<option value="${m}" ${m === PD.month ? 'selected' : ''}>${monthName(m)}</option>`).join('')}</select></div></div>
    <p class="fine" id="pstatus" hidden></p>
    <div class="stats">
      <div class="stat"><span>Sesje</span><b>${S.sessions}</b></div>
      <div class="stat"><span>Zadania dobrze</span><b>${S.pct == null ? '–' : S.pct + '%'}</b>${S.total ? `<small>${S.ok} z ${S.total}</small>` : ''}</div>
      ${PD.showGrade ? `<div class="stat"><span>Ocena miesięczna</span><b>${S.grade || '–'}</b>${PD.inProgress ? '<small>miesiąc trwa</small>' : ''}</div>` : ''}
    </div>
    <div><h3 class="h3">Dni pracy w kolejnych tygodniach</h3><ul class="wk">${weekRows}</ul></div>
    ${PD.showGrade ? `<p class="fine">Jak liczy się ocena: liczą się dni pracy i procent poprawnych odpowiedzi. 5 dni w każdym tygodniu: 90–100% → 6, 75–89% → 5, 60–74% → 4. Część tygodni po 5 dni, reszta po 4: 90–100% → 5, 75–89% → 4. 4 dni w każdym tygodniu: 90–100% → 5, 75–89% → 4. Tygodnie ferii i świąt się nie liczą.${S.grade || !S.counts.length ? '' : ' W tym miesiącu oceny na razie nie ma. Przy co najmniej 4 dniach pracy w każdym tygodniu i co najmniej 50% poprawnych dziecko dostaje naklejkę, a 6 naklejek to ocena 6.'}</p>` : ''}
    ${S.weak.length ? `<div><h3 class="h3">Warto powtórzyć</h3><ul class="weak">${S.weak.map(w => `<li><span>${esc(w.name)}</span><small>błąd w ${w.bad} z ${w.att} zadań</small></li>`).join('')}</ul></div>` : S.total ? '<p class="msg ok">W tym miesiącu nie widać tematu, który sprawia wyraźny kłopot.</p>' : ''}
  </section>
  <section class="card"><h2>Ostatnie sesje</h2>
    ${PD.recent.length ? `<ul class="wk">${PD.recent.map(r => `<li><span>${dmy(r.date)}</span><b>${r.ok} z ${r.total} dobrze</b></li>`).join('')}</ul>` : '<p class="fine">Dziecko nie zrobiło jeszcze żadnej sesji.</p>'}
  </section>
  ${c.curG ? `<section class="card"><h2>${CH[c.curG].name} <small>dział bieżący</small></h2><ul class="skills">${skillRows(inCh(c.curG), c.open)}</ul></section>` : ''}
  ${c.revCh.slice().reverse().map(ch => `<section class="card"><h2>${ch.name} <small>powtórki</small></h2><ul class="skills">${skillRows(inCh(ch.g), null)}</ul></section>`).join('')}
  <p class="fine">Poziom tematu rośnie, gdy dziecko rozwiązuje zadania dobrze w kolejnych dniach, a spada po błędzie. Panel tylko pokazuje wyniki i niczego w nich nie zmienia.</p>`;
  document.getElementById('plogout').onclick = () => { PD = null; rcred = null; prof = null; viewParentLogin(); };
  document.getElementById('pmon').onchange = async e => {
    const s = document.getElementById('pstatus'); s.textContent = 'Wczytuję…'; s.hidden = false;
    try { PD = await call('parentData', rcred.code, rcred.pass, e.target.value); viewParent(); } catch (err) { s.textContent = errText(err); }
  };
}
// Karty z hasłami rodziców do wydrukowania (z panelu nauczycielki)
function viewParentCards(klasa) {
  const c = T.classes.find(x => String(x.klasa) === String(klasa)); if (!c) return;
  const url = T.parentUrl || '';
  app.classList.add('wide');
  app.innerHTML = `<header class="top noprint"><div><p class="eyebrow">Panel nauczycielki</p><h1>Karty dla rodziców, klasa ${esc(c.klasa)}</h1></div>
    <div class="tbtns"><button class="btn" id="pcback">Wróć do panelu</button><button class="btn primary" id="pcprint">Drukuj</button></div></header>
    <p class="fine noprint">Jeśli przycisk Drukuj nie działa, użyj Ctrl+P (na Macu Cmd+P). Kartki są małe, po 8 na stronie A4.</p>
    <div class="pcards">${c.students.map(s => `<div class="pcard"><p class="eyebrow">Matma co dzień · panel rodzica</p>
      <p>Tu sprawdzą Państwo, jak dziecko ćwiczy matematykę.</p>
      ${url ? `<p class="mono url">${esc(url)}</p>` : '<p class="fine">Adres: link do aplikacji z dopiskiem ?r=1</p>'}
      <div class="pcred"><span>Kod ucznia</span><b>${esc(s.kod)}</b><span>Hasło rodzica</span><b>${esc(s.hasloRodzica || '—')}</b></div></div>`).join('')}</div>`;
  document.getElementById('pcback').onclick = () => viewTeacher();
  document.getElementById('pcprint').onclick = () => { try { window.print(); } catch (e) { /* Ctrl+P */ } };
}
(function boot() { if (MODE === 'n') viewTeacherLogin(); else if (MODE === 'r') viewParentLogin(); else if (MODE === 'p') viewPreview(); else viewLogin(); })();

</script>
